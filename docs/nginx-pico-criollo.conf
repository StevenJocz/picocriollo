# Proxy de Pico Criollo (Nginx Proxy Manager: pegar en "Advanced > Custom Nginx Configuration",
# o usar como server{} en un nginx propio). Destino: http://pico-criollo:3000 en la red Docker "backend".

# Subidas: videos de hasta 60 MB (VIDEO_LIMIT_BYTES) más el sobre de la petición.
client_max_body_size 70m;
client_body_timeout 120s;

# Avisos en vivo (SSE). Sin esto nginx guarda la respuesta en búfer y las notificaciones llegan tarde o no llegan.
location = /api/notifications/stream {
    proxy_pass http://pico-criollo:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Subida de medios en bruto (no JSON): sin búfer de petición para no llenar disco con videos.
location = /api/media {
    proxy_pass http://pico-criollo:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
}
