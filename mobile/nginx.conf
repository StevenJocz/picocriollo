server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Lo que Expo exporta con huella en el nombre no cambia nunca: se guarda un año.
  location /_expo/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Las rutas de la app (/mercado/…, /perfil/…) las resuelve el navegador: todo lo demás devuelve index.html y que no se cachee.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
